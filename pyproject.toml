[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "proton-prefix-manager"
version = "0.1.0"
description = "Lightweight desktop utility to list, inspect, and safely remove Proton prefixes created by Steam."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "PySide6>=6.8",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-qt",
    "ruff",
    "mypy",
]

[tool.hatch.build.targets.wheel]
packages = ["core", "ui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
